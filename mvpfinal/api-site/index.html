<!DOCTYPE html>
<!--
  index.html — Dark Blue Valuation API · Licensing & Endpoint Reference
  ──────────────────────────────────────────────────────────────────────
  Two-tab SPA. No build step — open in a browser or serve with any
  static file server (e.g. `npx serve .`).

  Tab map (hash → renderer):
    #license    → js/pages/license.js     (default)
    #endpoints  → js/pages/endpoints.js
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
        content="Dark Blue Valuation API — licensing, authentication, and endpoint reference for fantasy baseball draft intelligence." />
  <meta name="theme-color" content="#080d19" />

  <title>Dark Blue API — Licensing & Endpoints</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- CSS: tokens → base → nav → components → page styles -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/nav.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>

<body>

  <div
    id="scroll-sentinel"
    aria-hidden="true"
    style="position:absolute;top:0;height:1px;width:100%;pointer-events:none;z-index:-1;"
  ></div>

  <header id="site-nav" role="banner"></header>
  <main id="app-viewport" role="main"></main>

  <!-- JS: state → router → nav → page renderers -->
  <script src="js/state.js"></script>
  <script src="js/router.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/pages/license.js"></script>
  <script src="js/pages/endpoints.js"></script>

  <script>
    DB.router.register('license',   DB.pages.license);
    DB.router.register('endpoints', DB.pages.endpoints);
  </script>

</body>
</html>
